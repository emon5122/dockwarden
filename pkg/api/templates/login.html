<!doctype html>
<html lang="en" class="h-full bg-gray-900">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DockWarden - Login</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="h-full flex items-center justify-center">
        <div class="w-full max-w-md">
            <div
                class="bg-gray-800 rounded-lg shadow-lg p-8 border border-gray-700"
            >
                <div class="text-center mb-8">
                    <span class="text-4xl">&#x1F433;</span>
                    <h1 class="text-2xl font-bold text-white mt-2">
                        DockWarden
                    </h1>
                    <p class="text-gray-400 text-sm mt-1">
                        Enter your API token to continue
                    </p>
                </div>

                {{if eq .Error "invalid"}}
                <div
                    class="mb-4 p-3 rounded bg-red-900/50 border border-red-700 text-red-300 text-sm"
                >
                    Invalid token. Please try again.
                </div>
                {{end}}

                <form method="POST" action="/login">
                    <div class="mb-6">
                        <label
                            for="token"
                            class="block text-sm font-medium text-gray-300 mb-2"
                            >API Token</label
                        >
                        <input
                            type="password"
                            id="token"
                            name="token"
                            required
                            autofocus
                            autocomplete="current-password"
                            class="w-full rounded-md bg-gray-700 border border-gray-600 px-4 py-3 text-white placeholder-gray-400 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none"
                            placeholder="Enter your token"
                        />
                    </div>
                    <button
                        type="submit"
                        class="w-full rounded-md bg-blue-600 px-4 py-3 text-sm font-medium text-white hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors"
                    >
                        Sign In
                    </button>
                </form>
            </div>
        </div>
    </body>
</html>
