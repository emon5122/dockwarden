name: Build and Release

# Images are built and pushed ONLY for a release tag (vX.Y.Z), never for main.
# release-please creates the tag with the GH_TOKEN PAT, so the tag push itself
# triggers this workflow. workflow_dispatch / workflow_call rebuild the image of
# an existing tag (inputs.tag). No CI on main pushes or ordinary PRs (saves Actions minutes): tests + a no-push
# build run on the release-please PR, and tests gate the image on the tag.
on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build, e.g. v1.2.3"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build, e.g. v1.2.3"
        required: true
        type: string

env:
  REGISTRY: docker.io
  IMAGE_NAME: emon5122/dockwarden
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-please--')
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out

  e2e:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-please--')
    name: E2E compose roll
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Compose roll on a real daemon (docker-in-docker)
        run: test/e2e/compose-roll.sh

  build:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-please--')
    name: Build
    runs-on: ubuntu-latest
    needs: [test, e2e]
    env:
      # true for a release build (tag push, dispatch or call); false for main/PR checks
      RELEASE: ${{ inputs.tag != '' || startsWith(github.ref, 'refs/tags/v') }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    # Release builds share one group: a newer release build cancels an older one.
    # main/PR check builds use their own per-ref group, so a release-please
    # commit on main never cancels a running release build.
    concurrency:
      group: ${{ (inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')) && 'docker-dockwarden' || format('docker-dockwarden-check-{0}', github.ref) }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build info
        id: info
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: env.RELEASE == 'true'
        uses: docker/login-action@v4
        with:
          username: emon5122
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: env.RELEASE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: emon5122
          password: ${{ secrets.GH_TOKEN }}

      # Tags: X.Y.Z, X.Y, X and latest (latest only for a non-prerelease tag).
      # Never main, branch or sha tags.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.GHCR_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=semver,pattern={{major}},value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ env.RELEASE == 'true' && !contains(env.RELEASE_TAG, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./build/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ env.RELEASE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.RELEASE == 'true' && env.RELEASE_TAG || 'dev' }}
            COMMIT=${{ steps.info.outputs.commit }}
            BUILD_DATE=${{ steps.info.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    # Binaries only on the tag push itself; an image rebuild (dispatch/call)
    # must not re-run GoReleaser against an existing release.
    if: (github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-please--')) && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
